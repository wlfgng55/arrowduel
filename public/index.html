<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ok Meydanı – 3D Okçu Düellosu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;font-family:Georgia,'Times New Roman',serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.7))}
.card{width:min(92vw,420px);background:rgba(36,26,16,.9);border:2px solid #b08a45;border-radius:14px;padding:18px 20px;text-align:center;box-shadow:0 0 40px #000a}
h1{margin:0 0 2px;font-size:32px;letter-spacing:3px;color:#e8c15a;text-shadow:0 2px 0 #000}
.sub{color:#cdb88f;font-size:13px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #8a6a35;background:#1a120a;color:#fff;font-size:17px;text-align:center;margin-bottom:8px;outline:none;font-family:inherit}
input:focus{border-color:#e8c15a}
.btn{width:100%;padding:13px;border:0;border-radius:8px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(#b8392b,#7d1f16);margin-bottom:8px;cursor:pointer;font-family:inherit;border-bottom:3px solid #4a0f0a}
.btn.b{background:linear-gradient(#3b6fc4,#234a8f);border-bottom-color:#12294f}
.btn.g{background:#4a3a28;border-bottom-color:#2a2015}
.row{display:flex;gap:8px}.row input{margin:0}.row .btn{width:42%;margin:0}
#err{color:#ff9a8a;min-height:18px;font-size:14px;margin-top:6px}
#code{font-size:52px;letter-spacing:8px;font-weight:800;color:#e8c15a;margin:8px 0}
#rot{position:fixed;inset:0;background:#0b0d12;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait) and (max-width:800px){#rot{display:flex}}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fb{width:34%}.fb.r{text-align:right}
.nm{font-weight:800;font-size:15px;text-shadow:0 1px 3px #000;margin-bottom:2px}
.bar{height:15px;background:#000a;border:2px solid #e8c15a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#7dff6a,#27b81c);transition:width .15s}
.fb.r .bar i{margin-left:auto;background:linear-gradient(#ff7a6a,#c9251c)}
.mid{text-align:center;text-shadow:0 2px 4px #000}
#rd{font-size:13px;color:#e8c15a;font-weight:700;letter-spacing:1px}
#tm{font-size:28px;font-weight:800;line-height:1}
#sc{font-size:18px;letter-spacing:4px;color:#ffd24d}
#big{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(36px,11vw,100px);font-weight:900;font-style:italic;text-shadow:0 4px 0 #000,0 0 30px #b8392b;opacity:0;transform:scale(.5)}
#big.show{opacity:1;transform:scale(1);transition:transform .25s cubic-bezier(.2,2,.4,1),opacity .15s}
#tip{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:14px;text-shadow:0 1px 3px #000;color:#ffe9a8;padding:0 20%}
#xh{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;opacity:.9;box-shadow:0 0 4px #000}
#xh::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#xh.full{border-color:#ffd24d}#xh.rl{border-color:#888;opacity:.5}
#xh.hm{border-color:#ff4d4d}
#zl{position:absolute;left:0;top:20%;bottom:0;width:42%;pointer-events:auto;touch-action:none}
#zr{position:absolute;right:0;top:15%;bottom:0;width:58%;pointer-events:auto;touch-action:none}
#stk{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid #fff7;background:#ffffff18;display:none;pointer-events:none}
#stk i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fffc}
#bC{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:3px solid #fff9;background:#000000777;color:#fff;font-weight:800;font-size:13px;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3}
#bC.on{background:#2a63ffaa}
#res{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center}
#res h2{font-size:54px;margin:0 0 4px;color:#e8c15a}
#res p{margin:0 0 14px;color:#e0d6c0}
#res .btn{width:240px}
#flash{position:fixed;inset:0;background:radial-gradient(transparent 40%,#f00);opacity:0;pointer-events:none;transition:opacity .3s}
</style></head><body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud" class="hide">
  <div class="top">
    <div class="fb"><div class="nm" id="n0"></div><div class="bar"><i id="h0"></i></div></div>
    <div class="mid"><div id="rd"></div><div id="tm">90</div><div id="sc"></div></div>
    <div class="fb r"><div class="nm" id="n1"></div><div class="bar"><i id="h1"></i></div></div>
  </div>
  <div id="xh"></div>
  <div id="big"></div>
  <div id="tip">Sağ tarafa BASILI TUT: yayı ger • SÜRÜKLE: nişan ayarı • BIRAK: ok at<br>ÇÖMEL ile siperin arkasına saklan</div>
  <div id="zl"></div><div id="zr"></div>
  <div id="bC">ÇÖMEL</div>
</div>
<div id="stk"><i></i></div>
<div id="res" class="hide"><h2 id="rt"></h2><p id="rs"></p><button class="btn" id="rm">Tekrar Oyna</button><button class="btn g" id="rx">Ana Menü</button></div>

<div id="menu">
  <div class="card" id="m1">
    <h1>OK MEYDANI</h1><div class="sub">3D Online Okçu Düellosu</div>
    <input id="name" maxlength="12" placeholder="Adın" autocomplete="off">
    <button class="btn" id="mk">ODA KUR</button>
    <div class="row"><input id="rc" maxlength="4" placeholder="KOD" autocomplete="off" style="text-transform:uppercase"><button class="btn b" id="jn">KATIL</button></div>
    <div id="err"></div>
  </div>
  <div class="card hide" id="m2">
    <div class="sub">Oda Kodu</div><div id="code">----</div>
    <div class="sub">Arkadaşın bu kodu girince düello otomatik başlar</div>
    <button class="btn b" id="cp">Linki Kopyala</button>
    <div class="sub">Rakip bekleniyor...</div>
  </div>
</div>
<div id="rot">📱↻<br>Telefonu yatay çevir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t, cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let ws,you=0,names=['',''],S=null,inGame=false,myCode='';

/* ---------- ses ---------- */
let AC;
function snd(f,d,type='square',v=.15,slide=0){
  if(!AC)return;try{
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const horn=()=>{snd(220,.9,'sawtooth',.12);setTimeout(()=>snd(330,.9,'sawtooth',.1),200)};
addEventListener('pointerdown',()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});

/* ---------- ağ / menü ---------- */
function connect(cb){
  if(ws&&ws.readyState===1)return cb();
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=cb;ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{if(inGame||!$('m2').classList.contains('hide')){alert('Bağlantı koptu');location.href=location.pathname}};
}
const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function nm(){const n=$('name').value.trim()||'Okçu';localStorage.setItem('on',n);return n}
$('name').value=localStorage.getItem('on')||'';
const qr=new URLSearchParams(location.search).get('r');if(qr)$('rc').value=qr.toUpperCase();
$('mk').onclick=()=>{$('err').textContent='';connect(()=>tx({t:'create',name:nm()}))};
$('jn').onclick=()=>{$('err').textContent='';const c=$('rc').value.trim();if(c.length<4){$('err').textContent='4 harfli kodu gir';return}connect(()=>tx({t:'join',name:nm(),code:c}))};
$('cp').onclick=()=>{const u=location.origin+location.pathname+'?r='+myCode;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$('cp').textContent='Kopyalandı ✓').catch(()=>prompt('Linki kopyala:',u))};
$('rm').onclick=()=>{tx({t:'rematch'});$('rm').textContent='Rakip bekleniyor...'};
$('rx').onclick=()=>location.href=location.pathname;

function onMsg(m){
  if(m.t==='err')$('err').textContent=m.msg;
  else if(m.t==='joined'){you=m.you;myCode=m.code;if(m.you===0){$('m1').classList.add('hide');$('m2').classList.remove('hide');$('code').textContent=m.code}}
  else if(m.t==='ready'){names=m.names;startGame()}
  else if(m.t==='left'){alert('Rakip odadan ayrıldı');location.href=location.pathname}
  else if(m.t==='s')onState(m);
}
function startGame(){
  inGame=true;$('menu').classList.add('hide');$('hud').classList.remove('hide');
  $('n0').textContent=names[you]+' (sen)';$('n1').textContent=names[1-you];
  $('n0').style.color=you?'#8fb8ff':'#ff8a7a';$('n1').style.color=you?'#ff8a7a':'#8fb8ff';
  setTimeout(()=>$('tip').classList.add('hide'),9000);
  try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e);screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
}
let bigT;
function big(t,ms=900){const e=$('big');e.textContent=t;e.className='show';clearTimeout(bigT);if(ms)bigT=setTimeout(()=>e.className='',ms)}

/* ---------- oyun durumu (istemci) ---------- */
const P={x:0,z:-18};            // kendi konumum (istemci tarafında hesaplanır)
const vo={x:0,z:18,yaw:Math.PI}; // rakip (yumuşatılmış)
let lastN=0,lastPh='',shake=0,hmT=0;
const stuck=[],arrows=new Map();

function onState(m){
  const first=!S;S=m;
  const me=m.p[you],op=m.p[1-you];
  if(first){P.x=me.x;P.z=me.z;vo.x=op.x;vo.z=op.z;vo.yaw=op.yaw}
  if(m.ph==='count'){P.x=me.x;P.z=me.z;if(lastPh!=='count'){clearStuck();crouch=false;drawing=false;offYaw=offPitch=0;$('bC').classList.remove('on')}}
  for(const e of m.ev){
    if(e.e==='fight'){big('SAVAŞ!');horn()}
    else if(e.e==='shoot'){if(e.i!==you)snd(240,.15,'triangle',.12,-120)}
    else if(e.e==='stick'){addStuck(e);snd(e.k==='g'?90:140,.08,'square',.08)}
    else if(e.e==='hit'){
      puff(e.x,e.y,e.z,0xb01818,10);snd(130,.18,'sawtooth',.3,-80);
      if(e.i===you){shake=.35;$('flash').style.opacity=.6;setTimeout(()=>$('flash').style.opacity=0,140)}
      else{hmT=.25;if(e.head){big('KAFADAN!',900)}}
    }
    else if(e.e==='rend'){
      horn();
      if(e.w===-1)big(e.ko?'İKİSİ DE DÜŞTÜ':'BERABERE',2200);
      else big(e.w===you?'RAUND SENİN!':'RAUND RAKİBİN',2200);
    }
  }
  if(m.ph==='count'){const n=Math.ceil(m.cd);if(n!==lastN){lastN=n;big(String(n),1000);snd(600,.15,'square',.15)}}else lastN=0;
  $('rd').textContent='RAUND '+m.r+' / 3';
  $('tm').textContent=Math.ceil(m.tl);
  $('sc').textContent=m.sc[you]+' - '+m.sc[1-you];
  $('h0').style.width=Math.max(0,me.hp)+'%';$('h1').style.width=Math.max(0,op.hp)+'%';
  // okların senkronu
  const seen=new Set();
  for(const a of m.ar){
    seen.add(a[0]);let o=arrows.get(a[0]);
    if(!o){o={g:makeArrow()};scene.add(o.g);arrows.set(a[0],o)}
    o.x=a[1];o.y=a[2];o.z=a[3];o.vx=a[4];o.vy=a[5];o.vz=a[6];
  }
  for(const [id,o] of arrows)if(!seen.has(id)){scene.remove(o.g);arrows.delete(id)}
  if(m.ph==='over'){
    $('res').classList.remove('hide');
    const w=m.win;$('rt').textContent=w===-1?'BERABERE':(w===you?'ZAFER! 🏆':'YENİLDİN');
    $('rs').textContent=(w===-1?'':names[w]+' düelloyu kazandı – ')+m.sc[you]+' : '+m.sc[1-you];
  }else if(lastPh==='over'){$('res').classList.add('hide');$('rm').textContent='Tekrar Oyna'}
  lastPh=m.ph;
}

/* ---------- kontroller ---------- */
let vx=0,vy=0,kx=0,ky=0,crouch=false,drawing=false,drawT0=0,reloadUntil=0,offYaw=0,offPitch=0,aimYaw=0,aimPitch=.04;
const now=()=>performance.now();
const drawPow=()=>drawing?Math.min(1,(now()-drawT0)/900):0;
const canAct=()=>inGame&&S&&S.ph==='fight'&&S.p[you].hp>0;
function setCrouch(v){crouch=v;$('bC').classList.toggle('on',v)}
function startDraw(){if(!canAct()||now()<reloadUntil)return false;drawing=true;drawT0=now();setCrouch(false);return true}
function endDraw(fire){
  if(!drawing)return;const pw=drawPow();drawing=false;
  if(fire&&pw>=.2&&canAct()){tx({t:'shoot',pw:+pw.toFixed(2),yaw:+aimYaw.toFixed(3),pitch:+aimPitch.toFixed(3)});reloadUntil=now()+600;snd(260,.18,'triangle',.18,-140)}
}
const zl=$('zl'),stk=$('stk'),knob=stk.firstElementChild;let sid=null,ox=0,oy=0;
zl.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;zl.setPointerCapture(sid);ox=e.clientX;oy=e.clientY;stk.style.left=ox+'px';stk.style.top=oy+'px';stk.style.display='block';knob.style.transform='none'});
zl.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;let dx=e.clientX-ox,dy=e.clientY-oy;const l=Math.hypot(dx,dy),R=55;if(l>R){dx*=R/l;dy*=R/l}vx=dx/R;vy=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`});
const relS=e=>{if(e.pointerId!==sid)return;sid=null;vx=vy=0;stk.style.display='none'};
zl.addEventListener('pointerup',relS);zl.addEventListener('pointercancel',relS);
const zr=$('zr');let rid=null,lx=0,ly=0;
zr.addEventListener('pointerdown',e=>{e.preventDefault();if(rid!==null)return;rid=e.pointerId;zr.setPointerCapture(rid);lx=e.clientX;ly=e.clientY;startDraw()});
zr.addEventListener('pointermove',e=>{if(e.pointerId!==rid)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(drawing){offYaw=cl(offYaw-dx*.0028,-.6,.6);offPitch=cl(offPitch-dy*.0028,-.35,.7)}});
zr.addEventListener('pointerup',e=>{if(e.pointerId!==rid)return;rid=null;endDraw(true)});
zr.addEventListener('pointercancel',e=>{if(e.pointerId!==rid)return;rid=null;endDraw(false)});
$('bC').addEventListener('pointerdown',e=>{e.preventDefault();if(!drawing)setCrouch(!crouch)});
const KEYS={};
function kupd(){kx=(KEYS.KeyD?1:0)-(KEYS.KeyA?1:0);ky=(KEYS.KeyS?1:0)-(KEYS.KeyW?1:0);
  if(drawing){offYaw=cl(offYaw+((KEYS.ArrowLeft?1:0)-(KEYS.ArrowRight?1:0))*.02,-.6,.6);offPitch=cl(offPitch+((KEYS.ArrowUp?1:0)-(KEYS.ArrowDown?1:0))*.02,-.35,.7)}}
addEventListener('keydown',e=>{if(KEYS[e.code])return;KEYS[e.code]=1;if(e.code==='KeyC'&&!drawing)setCrouch(!crouch);if(e.code==='Space')startDraw();kupd()});
addEventListener('keyup',e=>{KEYS[e.code]=0;if(e.code==='Space')endDraw(true);kupd()});
setInterval(()=>{if(drawing)kupd()},30);
document.addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(!inGame||!S)return;tx({t:'in',x:+P.x.toFixed(2),z:+P.z.toFixed(2),yaw:+aimYaw.toFixed(3),pitch:+aimPitch.toFixed(3),c:crouch?1:0,d:+drawPow().toFixed(2)})},33);

/* ---------- sahne ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();const FOG=0xcfe3f5;scene.background=new THREE.Color(FOG);scene.fog=new THREE.Fog(FOG,55,260);
const cam=new THREE.PerspectiveCamera(60,1,.1,700);
let baseFov=60;
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;baseFov=cam.aspect<1.3?75:60;cam.fov=baseFov;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const M=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const cyl=(rt,rb,h,mat,seg=12)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
const sph=(r,mat,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);m.scale.set(sx,sy,sz);return m};
const bx=(w,h,d,mat)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);return t}
const rr=(a,b)=>a+Math.random()*(b-a);

// ışık
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x4a6a30,.75));
const sun=new THREE.DirectionalLight(0xfff0d0,1.15);sun.position.set(24,38,14);sun.target.position.set(0,0,0);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:5,far:90});sun.shadow.bias=-.0006;
scene.add(sun,sun.target);

// gökyüzü
{const t=tex(2,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2f6fd0');gr.addColorStop(.5,'#cfe3f5');gr.addColorStop(1,'#cfe3f5');g.fillStyle=gr;g.fillRect(0,0,w,h)});t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
 scene.add(new THREE.Mesh(new THREE.SphereGeometry(450,16,12),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false})));
 const s=new THREE.Mesh(new THREE.SphereGeometry(14,12,8),new THREE.MeshBasicMaterial({color:0xfff6d0,fog:false}));s.position.set(240,190,110);scene.add(s)}

// zemin
const grassT=tex(128,128,(g,w,h)=>{g.fillStyle='#4e8c30';g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){g.fillStyle=`hsl(${rr(85,115)},${rr(40,60)}%,${rr(24,42)}%)`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[90,90]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({map:grassT,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
{const t=tex(128,256,(g,w,h)=>{g.fillStyle='#7a5a36';g.fillRect(0,0,w,h);for(let i=0;i<2200;i++){g.fillStyle=`hsl(${rr(25,38)},${rr(30,45)}%,${rr(26,44)}%)`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}
  g.globalCompositeOperation='destination-in';const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.3,'#000');gr.addColorStop(.7,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)});
 t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
 const p=new THREE.Mesh(new THREE.PlaneGeometry(9,48),new THREE.MeshStandardMaterial({map:t,transparent:true,roughness:1,depthWrite:false}));p.rotation.x=-Math.PI/2;p.position.y=.02;p.receiveShadow=true;scene.add(p)}
// çim kümeleri

const Ydn=new THREE.Vector3(0,-1,0),YV=new THREE.Vector3(0,1,0);
function ik(S,E,target,pole){
  const L1=.3,L2=.3,to=target.clone().sub(S.position);let d=to.length();
  const mx=L1+L2-.005;if(d>mx){to.multiplyScalar(mx/d);d=mx}if(d<.15){to.setLength(.15);d=.15}
  const dir=to.clone().normalize();
  const a=Math.acos(cl((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const pv=pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir)));if(pv.lengthSq()<1e-6)pv.set(0,-1,0);pv.normalize();
  const up=dir.clone().multiplyScalar(Math.cos(a)).add(pv.multiplyScalar(Math.sin(a)));
  const fore=to.clone().sub(up.clone().multiplyScalar(L1)).normalize();
  S.quaternion.setFromUnitVectors(Ydn,up);
  E.quaternion.setFromUnitVectors(Ydn,fore.applyQuaternion(S.quaternion.clone().invert()));
}

  b.knee[0].rotation.x=.1+1.3*cr+Math.max(0,cs)*.6*w*(1-cr);b.knee[1].rotation.x=.1+1.3*cr+Math.max(0,-cs)*.6*w*(1-cr);

  const nl=nockT.clone().sub(bowPos).applyQuaternion(b.bow.quaternion.clone().invert());
  nl.lerp(V3(0,0,-.14),1-A);
  b.sPos.set([0,.55,-.14,nl.x,nl.y,nl.z,0,-.55,-.14]);b.sGeo.attributes.position.needsUpdate=true;
  b.arr.visible=draw>.02&&A>.3;b.arr.position.set(nl.x,nl.y,nl.z+.375);
  ik(b.arm[0],b.el[0],bowPos,V3(.6,-.7,-.2));

    camD+=((drawing?2.2:3.0)-camD)*k(10);
    const tg=SH.camPos(P.x,P.z,aimYaw,aimPitch,camD);tg[1]-=.55*my.cr;
    const kk=k(25);cam.position.set(lerp(cam.position.x,tg[0],kk),lerp(cam.position.y,tg[1],kk),lerp(cam.position.z,tg[2],kk));
    if(shake>0){cam.position.x+=rr(-.5,.5)*shake*.3;cam.position.y+=rr(-.5,.5)*shake*.3;shake=Math.max(0,shake-dt*1.3)}
    const d=SH.dir(aimYaw,aimPitch);cam.lookAt(cam.position.x+d[0],cam.position.y+d[1],cam.position.z+d[2]);
    fovCur+=((drawing?baseFov*.78:baseFov)-fovCur)*k(10);if(Math.abs(cam.fov-fovCur)>.05){cam.fov=fovCur;cam.updateProjectionMatrix()}
    // artı imleç
    const pw=drawPow(),rl=now()<reloadUntil;
    const sz=drawing?70-48*pw:26;xh.style.width=xh.style.height=sz+'px';xh.style.margin=(-sz/2-2)+'px 0 0 '+(-sz/2-2)+'px';
    hmT=Math.max(0,hmT-dt);xh.className=hmT>0?'hm':(rl?'rl':(pw>=1?'full':''));
    xh.style.display=me.hp>0?'block':'none';
  }else{
    menuA+=dt*.18;cam.position.set(Math.sin(menuA)*30,9,Math.cos(menuA)*30);cam.lookAt(0,1.5,0);
  }
  renderer.render(scene,cam);
}
loop();
</script>
